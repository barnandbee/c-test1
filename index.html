<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple daily geometric, mathematical, verbal and logical brain-training workout." />
  <meta name="theme-color" content="#0b2545" />
  <title>Brain Trainer — Daily Workout</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧠</text></svg>" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <nav id="topnav" class="topnav" aria-label="Main" hidden></nav>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <p>Brain Trainer · scores are stored only in this browser.
      <button id="reset-data" class="link-btn">Reset all data</button>
    </p>
  </footer>

  <!-- screen-reader live region for round feedback -->
  <div id="sr-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/games.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('reset-data').addEventListener('click', function () {
      if (confirm('Reset your mascot, scores and history? This cannot be undone.')) {
        Store.resetAll();
        location.reload();
      }
    });
  </script>
</body>
</html>
